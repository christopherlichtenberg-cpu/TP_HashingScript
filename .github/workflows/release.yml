# Builds HashReportTool.exe on a Windows runner and publishes it as a GitHub
# Release. Runs when a version tag is pushed, e.g.:
#     git tag v1.0 && git push origin v1.0
name: Build Windows EXE release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Smoke-test hashing on Windows
        shell: python
        run: |
          import csv, hashlib, os, sys, tempfile
          sys.path.insert(0, os.getcwd())  # script runs from a temp file
          import hash_report_tool as h
          tmp = tempfile.mkdtemp()
          src = os.path.join(tmp, "Evidence", "sub")
          os.makedirs(src)
          data = os.urandom(3 * h.CHUNK_SIZE + 17)
          with open(os.path.join(src, "big.bin"), "wb") as f:
              f.write(data)
          report = h.default_report_path(os.path.join(tmp, "Evidence"))
          n, errors = h.run_hash_job(os.path.join(tmp, "Evidence"), ["MD5", "SHA-1", "SHA-256"], report)
          assert n == 1 and not errors, (n, errors)
          row = list(csv.reader(open(report, encoding="utf-8-sig")))[1]
          assert row[1] == os.path.join("sub", "big.bin"), row
          assert row[4:7] == [hashlib.md5(data).hexdigest(), hashlib.sha1(data).hexdigest(),
                              hashlib.sha256(data).hexdigest()], row
          print("Smoke test passed:", row)

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name HashReportTool hash_report_tool.py

      - name: Record SHA-256 of the build
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\HashReportTool.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HashReportTool.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HashReportTool
          path: |
            dist/HashReportTool.exe
            dist/SHA256SUMS.txt
            README.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          Standalone Windows build of the eDiscovery Hash Report Tool. No Python install needed.

          Download **HashReportTool.exe** and see **README.txt** for how to use it.
          SHA-256 of the .exe is in **SHA256SUMS.txt**; keep it with your chain-of-custody records.
          "@
          gh release create "${{ github.ref_name }}" dist\HashReportTool.exe dist\SHA256SUMS.txt README.txt `
            --title "Hash Report Tool ${{ github.ref_name }}" --notes $notes
